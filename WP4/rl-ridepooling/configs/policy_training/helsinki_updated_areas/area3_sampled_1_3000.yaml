train: True
test: True
test_baseline: False
test_random: False

env:
  timesteps: 3000
  total_iters: 100
  delta: 1  # step of policy applying (delta=1 means one simulation iteration)
  num_envs: 1  # change this to control parallelism
  sumo_seed: 4220
  sumocfg: "nets/ridepooling/Helsinki updated areas/area3/area3_sampled_1_3000.sumocfg.xml"
  use_gui: False
  verbose: True
  obs_dim: 6

baseline:
  num_periods: 5
  num_actions: 1

dqn:
  policy: MlpPolicy
  learning_rate: 0.0003
  learning_starts: 1
  train_freq: 1
  gradient_steps: -1
  exploration_fraction: 0.3
  exploration_initial_eps: 1
  exploration_final_eps: 0.2
  verbose: 1
  buffer_size: 200000

tests:
  num_tests: 10
